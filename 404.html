<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>페이지를 찾을 수 없어요 | 보험 보장 가이드</title>
<style>
  :root { --bg: #f3f8ec; --ink: #1f4a2a; --sub: #3d5a43; --line: #8bb07a; }
  @media (prefers-color-scheme: dark) { :root { --bg: #16261b; --ink: #cfe8c9; --sub: #a8c4a6; --line: #5f8a5a; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--ink);
         font-family: 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif; text-align: center;
         padding: 24px max(16px, env(safe-area-inset-left, 0px)); box-sizing: border-box; }
  h1 { font-size: 1.6rem; margin: 0 0 10px; }
  p { color: var(--sub); line-height: 1.7; margin: 0 0 22px; }
  a { display: inline-block; padding: 12px 24px; border-radius: 999px; border: 2px solid var(--line);
      color: var(--ink); text-decoration: none; font-weight: 700; background: #fff; }
  @media (prefers-color-scheme: dark) { a { background: transparent; } }
</style>
<script>
  // 대소문자만 다른 주소면 올바른 주소로, 그 밖에는 3초 뒤 홈으로 이동
  (function () {
    var base = '/insurance-guide/';
    var path = location.pathname;
    var lower = path.toLowerCase();
    if (lower.indexOf(base) === 0 && path !== lower) {
      var name = lower.slice(base.length);
      location.replace(base + name.replace(/^chapter/, 'ch') + location.hash);
      return;
    }
    if (lower.indexOf(base) !== 0) { location.replace(base); return; }
    setTimeout(function () { location.replace(base); }, 3000);
  })();
</script>
</head><body>
<main>
  <h1>찾으시는 페이지가 없어요</h1>
  <p>주소가 바뀌었거나 잘못 입력된 것 같아요.<br>잠시 후 <b>보험이 쉬워지는 시간</b> 홈으로 이동합니다.</p>
  <a href="/insurance-guide/">지금 홈으로 가기</a>
</main>
</body></html>
