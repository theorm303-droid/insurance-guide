<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>페이지를 찾을 수 없어요 | 보험이 쉬워지는 시간</title>
<style>
  :root { --bg: #faf7f1; --ink: #17233a; --sub: #62605a; --pt: #EE7A13; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0f1622; --ink: #e5eaf2; --sub: #9ba7b9; --pt: #f08a4b; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--ink);
         font-family: 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif; text-align: center;
         padding: 24px 16px; box-sizing: border-box; }
  h1 { font-size: 1.6rem; margin: 0 0 10px; }
  p { color: var(--sub); line-height: 1.7; margin: 0 0 22px; }
  a { display: inline-block; padding: 12px 26px; border-radius: 10px; background: var(--pt); color: #fff; text-decoration: none; font-weight: 700; }
</style>
<script>
  // 예전 여러 쪽 주소(ch28.html, cat-lib.html, profile.html 등)는 새 홈페이지의 같은 글로, 그 밖에는 3초 뒤 홈으로
  (function () {
    var p = location.pathname.replace(/^\/insurance-guide\//, '/').toLowerCase();
    var m = p.match(/^\/(ch\d\d|app[a-e]|cat-[a-z]+|profile|contact|about)(\.html)?\/?$/);
    var c = p.match(/^\/chapter(\d\d)(\.html)?$/);
    if (m) { location.replace('/#' + m[1]); return; }
    if (c) { location.replace('/#ch' + c[1]); return; }
    setTimeout(function () { location.replace('/'); }, 3000);
  })();
</script>
</head><body>
  <main>
    <h1>찾으시는 페이지가 없어요</h1>
    <p>주소가 바뀌었거나 없는 페이지입니다.<br>잠시 후 홈으로 이동합니다.</p>
    <a href="/">보험친구.kr 홈으로</a>
  </main>
</body></html>
