<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<!-- 링크 미리보기 이미지(1200×630) 원본. Chrome 헤드리스 --window-size=1200,630 --screenshot 으로 assets/og-card.jpg 를 만든다 -->
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body { font-family: 'Malgun Gothic', 'Noto Sans KR', sans-serif; color: #fff; position: relative;
    background: radial-gradient(55% 75% at 92% 8%, rgba(240,124,42,.50), transparent 62%),
                radial-gradient(45% 65% at 4% 100%, rgba(240,124,42,.25), transparent 60%),
                linear-gradient(160deg, #1b2d4d 0%, #23395f 55%, #2c3f5e 100%); }
  .wave { position: absolute; left: 0; right: 0; bottom: 0; width: 100%; height: 200px; }
  .wrap { position: absolute; left: 86px; right: 80px; top: 0; bottom: 0; display: flex; align-items: center; gap: 56px; }
  .text { flex: 1; }
  .brand { display: flex; align-items: center; gap: 14px; font-size: 30px; font-weight: 800; letter-spacing: -1px; }
  .brand svg { width: 44px; height: 44px; }
  .kicker { display: inline-block; margin: 30px 0 18px; padding: 8px 22px; border-radius: 999px; background: rgba(255,255,255,.13); color: #ffd9bd; font-size: 27px; font-weight: 700; }
  h1 { margin: 0; font-size: 68px; line-height: 1.22; font-weight: 900; letter-spacing: -3px; }
  .chips { display: flex; gap: 12px; margin-top: 30px; }
  .chips b { font-size: 24px; padding: 7px 20px; border-radius: 999px; border: 2px solid rgba(255,255,255,.45); color: #fff; }
  .photo { width: 290px; height: 290px; border-radius: 50%; object-fit: cover; object-position: 50% 30%; flex: none;
    border: 9px solid #fff; box-shadow: 0 0 0 7px #f07c2a, 0 18px 40px rgba(0,0,0,.35); }
</style></head>
<body>
  <svg class="wave" viewBox="0 0 1200 200" preserveAspectRatio="none"><path d="M0 150C260 220 520 210 760 150S1080 40 1200 50" fill="none" stroke="#f07c2a" stroke-width="3" opacity=".8"/></svg>
  <div class="wrap">
    <div class="text">
      <div class="brand"><svg viewBox="0 0 32 32"><path d="M16 3 5 7v8c0 7 4.8 12 11 14 6.2-2 11-7 11-14V7z" fill="none" stroke="#f07c2a" stroke-width="2.4" stroke-linejoin="round"/><path d="m11 16 3.5 3.5L21.5 12" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>보험이 쉬워지는 시간</div>
      <div class="kicker">보험친구 박혜경</div>
      <h1>내 보험, 제대로<br>준비되어 있을까요?</h1>
      <div class="chips"><b>실손</b><b>건강</b><b>간병</b><b>노후 준비</b><b>보험금 청구</b></div>
    </div>
    <img class="photo" src="profile-face.jpg" alt="">
  </div>
</body></html>
